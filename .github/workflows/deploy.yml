# 徒然ノート — 品質ゲート（公開は legacy branch 配信・ビルド済み静的ファイル直下）
# Lighthouse は真 Chrome で fail-closed（旧環境の「欠账」はこの audit ジョブで回収）
# lockfile ジョブ: package.json（@11ty/eleventy 3.1.7 厳密ピン）から package-lock.json を
# 再生してコミットする（[skip ci] で再帰防止）
name: audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: カスタムドメインの証書/配信を待機（最長 8 分・fail-closed）
        run: |
          ok=0
          for i in $(seq 1 48); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://tsurezure.jerrylabs.dev/ || true)
            echo "try $i: HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "時間内に利用可能になりませんでした"; exit 1; }
      - name: Lighthouse (fail-closed)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://tsurezure.jerrylabs.dev/
          configPath: ./lighthouserc.json

  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: package-lock.json を再生成（@11ty/eleventy 3.1.7 ピン済み）
        run: npm install --package-lock-only
      - name: 差分があればコミット（[skip ci] で再帰防止）
        run: |
          git config user.name "tsurezure-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "lockfile unchanged"
          else
            git commit -m "chore: package-lock.json を再生成（CI・[skip ci]）"
            git push
          fi
